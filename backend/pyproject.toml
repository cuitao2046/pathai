[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathai-backend"
version = "0.1.0"
description = "PathAI backend service"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
test = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["pathai_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
