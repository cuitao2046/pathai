[alembic]
# %(here)s = directory of this ini file, so both `-c backend/alembic.ini`
# (run from repo root) and running inside backend/ resolve the same migration
# scripts and import path, independent of cwd.
# NOTE: keep this file ASCII-only - configparser reads it with the locale
# codec (GBK on zh-CN Windows), so non-ASCII characters break parsing.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# sqlalchemy.url is resolved at runtime by alembic/env.py from
# PATHAI_DATABASE_URL / environment rules. Keep it empty here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
